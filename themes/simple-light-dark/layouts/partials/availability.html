{{ with .Site.Params.availability }}
  {{ if .enabled }}
  <style>
    .availability-banner {
      background-color: var(--bg-secondary);
      color: var(--text-color);
      border: 2px solid var(--link-color);
      border-radius: 6px;
      text-align: center;
      padding: var(--spacing-medium) var(--spacing-large);
      margin-bottom: var(--spacing-large);
    }
    .availability-banner a {
      font-weight: bold;
      margin: 0 0.5rem;
    }
    .availability-lobby {
      display: block;
      font-size: 0.95em;
      color: var(--text-secondary);
      margin-top: 0.3rem;
    }
  </style>
  <div class="availability-banner" role="status">
    <span class="availability-message">{{ .message }}</span>
    <a href="{{ .url }}" target="_blank" rel="noopener">{{ .linkText }}</a>
    {{ with .lobbyNote }}<span class="availability-lobby">{{ . }}</span>{{ end }}
  </div>
  {{ end }}
{{ end }}
