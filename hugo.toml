baseURL = 'https://worldwidestew.com/'
languageCode = 'en-us'
title = 'Worldwide Stew'
theme = "simple-light-dark"
copyright = '© 2026 Worldwide Stew, aka Michael Davis.'
enableEmoji = true
# the following line was moved here and is a fix from the previous version. 
paginate = 5 # This will show 5 posts per page

[markup.goldmark.renderer]
  unsafe = true

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 2
  [[menu.main]]
    name = "Deep-Dives"
    url = "/editorial/"
    weight = 3
  [[menu.main]]
    name = "Events"
    url = "/events/"
    weight = 4
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 5
  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 6
  [[menu.main]]
    name = "Podcast"
    url = "/media/"
    weight = 7

[outputFormats]
  [outputFormats.RSS]
    mediatype = "application/rss+xml"
    baseName = "feed"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[params]
  logo = "images/logo.png"
  [params.author]
    name = "Michael Davis"
    email = "worldwide@worldwidestew.com"

# I removed the paginate 


# Availability banner (added Nov 2026): there are twwo switches:
# Both on: the banner shows two lines, “available now” and “book a time.”
# availableNow = false: the live Proton Meet line disappears, but the booking line stays. This is your “I’m away” setting.
# Hide everything: set availableNow = false and put a # in front of the scheduleUrl line.
[params.availability]
  availableNow = false
  message = "I'm available to meet with you right now on end-to-end encrypted Proton Meet."
  linkText = "Join me on Proton Meet"
  url = "https://meet.proton.me/join/id-4JMMPJFH48#pwd-VW49SieAY3rp"
  scheduleMessage = "Prefer a time that suits you?"
  scheduleText = "Book a time with me"
  # scheduleUrl = "https://cal.com/mikethechap"