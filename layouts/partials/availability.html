{{ with .Site.Params.availability }}
  {{ $a := . }}
  {{ if or $a.availableNow $a.scheduleUrl }}
  <style>
    .availability-banner {
      background-color: var(--bg-secondary);
      color: var(--text-color);
      border: 2px solid var(--link-color);
      border-radius: 6px;
      text-align: center;
      padding: var(--spacing-medium) var(--spacing-large);
      margin-bottom: var(--spacing-large);
    }
    .availability-row + .availability-row {
      margin-top: 0.6rem;
    }
    .availability-banner a {
      font-weight: bold;
      margin: 0 0.5rem;
    }
  </style>
  <div class="availability-banner" role="status">
    {{ if $a.availableNow }}
    <div class="availability-row">
      <span>{{ $a.message }}</span>
      <a href="{{ $a.url }}" target="_blank" rel="noopener">{{ $a.linkText }}</a>
    </div>
    {{ end }}
    {{ with $a.scheduleUrl }}
    <div class="availability-row">
      {{ with $a.scheduleMessage }}<span>{{ . }}</span>{{ end }}
      <a href="{{ . }}" target="_blank" rel="noopener">{{ $a.scheduleText }}</a>
    </div>
    {{ end }}
  </div>
  {{ end }}
{{ end }}
